<svg xmlns="http://www.w3.org/2000/svg" width="44" height="12" viewBox="0 0 44 12" role="img" aria-label="Complexity 2 of 5">
<style>
    :root { --fg: #1f2328; --muted: #656d76; --line: #d0d7de; --accent: #0969da; --empty: #ebedf0; --chip: #f6f8fa; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e6edf3; --muted: #8d96a0; --line: #30363d; --accent: #4493f8; --empty: #161b22; --chip: #161b22; }
    }
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, monospace; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes pop { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }
</style>
<rect x="0" y="1" width="7" height="10" rx="1.5" fill="var(--accent)" style="opacity: 0; animation: fade .3s ease-out 0.30s forwards"/><rect x="9" y="1" width="7" height="10" rx="1.5" fill="var(--accent)" style="opacity: 0; animation: fade .3s ease-out 0.42s forwards"/><rect x="18" y="1" width="7" height="10" rx="1.5" fill="var(--empty)"/><rect x="27" y="1" width="7" height="10" rx="1.5" fill="var(--empty)"/><rect x="36" y="1" width="7" height="10" rx="1.5" fill="var(--empty)"/>
</svg>
